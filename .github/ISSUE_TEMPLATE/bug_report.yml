name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: sqlex version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js and TypeScript versions
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database and driver versions
      placeholder: PostgreSQL 17, pg 8.13
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include record definitions or schema, code, and the complete error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
